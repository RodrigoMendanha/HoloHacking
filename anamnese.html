<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Anamnese pré-consulta · HoloHacking</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Anamnese pre-consulta (publica, sem conta): uma coluna, uma etapa por vez, pensada para celular. */
:root {
  --fundo: #f4efe3; --papel: #fbf8f0; --tinta: #1d3a2e; --suave: #55705f; --titulo: #0b3325;
  --primaria: #0b3325; --secundaria: #c9a35a; --linha: rgba(29,58,46,.16); --erro: #a8442c; --ok: #1f6b47;
  --display: "Cormorant Garamond", Georgia, serif; --corpo: "Jost", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--fundo); color: var(--tinta); font-family: var(--corpo); font-size: 17px; line-height: 1.55; }
.envolve { max-width: 680px; margin: 0 auto; padding-inline: 16px; }
header.topo { background: var(--primaria); color: #f1ecdf; padding-block: 22px 20px; }
.prof { display: flex; align-items: center; gap: 14px; }
.prof img { width: 56px; height: 56px; object-fit: contain; border-radius: 12px; background: #fff; padding: 4px; flex: none; }
.prof b { display: block; font-family: var(--display); font-size: 22px; font-weight: 600; line-height: 1.15; }
.prof span { display: block; font-size: 14px; opacity: .85; }
.olho { font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--secundaria); margin: 18px 0 4px; }
h1 { font-family: var(--display); font-weight: 600; font-size: clamp(28px, 7vw, 38px); line-height: 1.1; margin: 0 0 6px; }
.topo p { margin: 0; opacity: .9; }
.barra { position: sticky; top: 0; z-index: 5; background: var(--papel); border-bottom: 1px solid var(--linha); }
.barra .envolve { padding-block: 10px; display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; justify-content: space-between; }
.passo-txt { font-size: 14px; color: var(--suave); }
.passo-txt b { color: var(--titulo); }
.salvo { font-size: 13px; color: var(--suave); }
.salvo.ruim { color: var(--erro); }
.trilho { flex-basis: 100%; height: 5px; border-radius: 5px; background: var(--linha); overflow: hidden; }
.trilho i { display: block; height: 100%; width: 0; background: var(--secundaria); transition: width .3s; }
main { padding-block: 18px 120px; }
h2 { font-family: var(--display); font-weight: 600; font-size: 28px; color: var(--titulo); margin: 6px 0 4px; }
h2:focus { outline: none; }
.intro { color: var(--suave); margin: 0 0 18px; font-size: 15px; }
.campo { background: var(--papel); border: 1px solid var(--linha); border-radius: 14px; padding: 14px 14px 16px; margin-bottom: 12px; }
.campo > label, .campo legend { display: block; font-weight: 500; color: var(--titulo); margin-bottom: 8px; padding: 0; }
fieldset.campo { min-width: 0; }
.ajuda { font-size: 13px; color: var(--suave); margin: -4px 0 8px; }
input[type=text], input[type=number], textarea, select { width: 100%; font: inherit; font-size: 17px; color: var(--tinta); background: #fff;
  border: 1px solid var(--linha); border-radius: 10px; padding: 11px 12px; }
textarea { min-height: 92px; resize: vertical; }
input:focus-visible, textarea:focus-visible, select:focus-visible, button:focus-visible, .chip:focus-within { outline: 3px solid var(--secundaria); outline-offset: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { position: relative; }
.chip input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.chip span { display: inline-block; padding: 9px 14px; border-radius: 999px; border: 1px solid var(--linha); background: #fff; font-size: 15px; }
.chip input:checked + span { background: var(--primaria); color: #fff; border-color: var(--primaria); }
.linha-medida { display: flex; gap: 8px; }
.linha-medida input { flex: 1; }
.linha-medida select { width: auto; }
.lista-item { display: grid; gap: 6px; border-top: 1px dashed var(--linha); padding-top: 10px; margin-top: 10px; }
.lista-item:first-of-type { border-top: 0; margin-top: 0; padding-top: 0; }
.btn { font: inherit; font-size: 16px; border-radius: 12px; padding: 12px 18px; cursor: pointer; border: 1px solid var(--primaria); background: transparent; color: var(--primaria); }
.btn-pri { background: var(--primaria); color: #fff; }
.btn-peq { font-size: 14px; padding: 8px 12px; }
.btn:disabled { opacity: .55; cursor: default; }
.rodape-nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--papel); border-top: 1px solid var(--linha); padding-bottom: env(safe-area-inset-bottom, 0); }
.rodape-nav .envolve { display: flex; gap: 10px; justify-content: space-between; padding-block: 10px; }
.rodape-nav .btn { flex: 1; }
.opcional { font-weight: 400; font-size: 13px; color: var(--suave); }
.nao-resp { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--suave); margin-top: 8px; }
.revisao h3 { font-family: var(--display); font-size: 22px; margin: 18px 0 6px; color: var(--titulo); }
.revisao dl { margin: 0; background: var(--papel); border: 1px solid var(--linha); border-radius: 12px; padding: 8px 14px; }
.revisao dt { font-size: 13px; color: var(--suave); margin-top: 8px; }
.revisao dd { margin: 0 0 4px; white-space: pre-wrap; word-break: break-word; }
.aviso { background: var(--papel); border: 1px solid var(--linha); border-radius: 14px; padding: 20px; margin-top: 24px; }
.aviso h2 { margin-top: 0; }
.erro { color: var(--erro); font-size: 15px; }
.privacidade { font-size: 13px; color: var(--suave); margin-top: 22px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="topo"><div class="envolve" id="cabeca">
  <p class="olho">Anamnese pré-consulta</p>
  <h1>Carregando…</h1>
</div></header>
<div class="barra" id="barra" hidden><div class="envolve">
  <span class="passo-txt" id="passo-txt"></span>
  <span class="salvo" id="salvo" role="status" aria-live="polite"></span>
  <div class="trilho" aria-hidden="true"><i id="trilho"></i></div>
</div></div>
<main class="envolve" id="conteudo" tabindex="-1"></main>
<nav class="rodape-nav" id="nav" aria-label="Navegação entre as etapas" hidden><div class="envolve">
  <button type="button" class="btn" id="btn-voltar">Voltar</button>
  <button type="button" class="btn btn-pri" id="btn-seguir">Continuar</button>
</div></nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<script src="/supabase-client.js"></script>
<script src="/anamnese-v2.js"></script>
<script src="/anamnese-publica.js"></script>
</body>
</html>
