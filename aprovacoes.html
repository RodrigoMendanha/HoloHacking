<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Revisão das perguntas · HoloHacking</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Pagina publica de revisao das perguntas do HOLOSCAN: uma coluna, cartoes por pergunta, barra de progresso fixa. */
:root {
  --fundo: #f4efe3; --papel: #fbf8f0; --tinta: #1d3a2e; --suave: #55705f; --titulo: #0b3325;
  --verde: #14503b; --verde-forte: #0b3325; --dourado: #a87f31; --linha: rgba(29,58,46,.14);
  --aprova: #1f6b47; --aprova-bg: rgba(31,107,71,.1); --nega: #a8442c; --nega-bg: rgba(168,68,44,.09);
  --edita: #8a6f32; --edita-bg: rgba(201,163,90,.16);
  --display: "Cormorant Garamond", Georgia, serif; --corpo: "Jost", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--fundo); color: var(--tinta); font-family: var(--corpo); font-size: 16px; line-height: 1.5; }
.envolve { max-width: 780px; margin: 0 auto; padding-inline: 16px; }
header.topo { background: var(--verde-forte); color: #ede8da; padding-block: 28px 24px; }
.olho { font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: #e2c98a; margin: 0 0 6px; }
h1 { font-family: var(--display); font-weight: 600; font-size: clamp(30px, 6vw, 42px); line-height: 1.08; margin: 0 0 8px; text-wrap: balance; }
.topo p.sub { margin: 0; opacity: .88; max-width: 60ch; }
.como { margin: 14px 0 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14px; opacity: .9; }
.barra { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--papel); border-bottom: 1px solid var(--linha); }
.barra .envolve { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding-block: 10px; }
.prog { flex: 1 1 220px; min-width: 0; }
.prog-txt { font-size: 14px; font-variant-numeric: tabular-nums; color: var(--suave); }
.prog-txt b { color: var(--titulo); }
.trilho { height: 6px; border-radius: 6px; background: var(--linha); overflow: hidden; margin-top: 4px; }
.trilho i { display: block; height: 100%; width: 0; background: var(--aprova); transition: width .3s; }
.barra select { font: inherit; font-size: 14px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--linha); background: #fff; color: var(--tinta); max-width: 100%; }
main { padding-block: 18px 80px; }
.sistema { margin-top: 26px; }
.sis-cab { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 12px; }
h2 { font-family: var(--display); font-weight: 600; font-size: 26px; color: var(--titulo); margin: 0; }
.sis-cont { font-size: 13px; color: var(--suave); }
.btn-lote { font: inherit; font-size: 13px; color: var(--aprova); background: none; border: 1px dashed var(--aprova); border-radius: 999px; padding: 4px 12px; cursor: pointer; }
.cartao { background: #fff; border: 1px solid var(--linha); border-radius: 14px; padding: 14px 16px; margin-top: 12px; }
.cartao.aprovar { border-color: var(--aprova); background: linear-gradient(0deg, var(--aprova-bg), var(--aprova-bg)), #fff; }
.cartao.negar { border-color: var(--nega); background: linear-gradient(0deg, var(--nega-bg), var(--nega-bg)), #fff; }
.cartao.editar { border-color: var(--dourado); background: linear-gradient(0deg, var(--edita-bg), var(--edita-bg)), #fff; }
.meta { font-size: 12px; letter-spacing: .06em; color: var(--suave); text-transform: uppercase; display: flex; flex-wrap: wrap; gap: 4px 10px; }
.pergunta { font-size: 18px; font-weight: 500; color: var(--titulo); margin: 6px 0 4px; }
.escala { font-size: 13px; color: var(--suave); margin: 0 0 10px; }
.acoes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.acoes button { font: inherit; font-weight: 600; font-size: 15px; padding: 11px 6px; border-radius: 10px; cursor: pointer; border: 1.5px solid var(--linha); background: var(--papel); color: var(--tinta); }
.acoes button[data-d="aprovar"][aria-pressed="true"] { background: var(--aprova); border-color: var(--aprova); color: #fff; }
.acoes button[data-d="negar"][aria-pressed="true"] { background: var(--nega); border-color: var(--nega); color: #fff; }
.acoes button[data-d="editar"][aria-pressed="true"] { background: var(--dourado); border-color: var(--dourado); color: #fff; }
.acoes button:disabled { opacity: .55; cursor: default; }
.acoes button:focus-visible, .btn:focus-visible, textarea:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--dourado); outline-offset: 2px; }
.extra { margin-top: 10px; display: grid; gap: 6px; }
.extra label { font-size: 13px; font-weight: 600; color: var(--titulo); }
textarea, input[type=text] { font: inherit; font-size: 16px; width: 100%; border: 1px solid var(--linha); border-radius: 10px; padding: 10px 12px; background: #fff; color: var(--tinta); }
textarea { min-height: 84px; resize: vertical; }
.linha-acoes { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { font: inherit; font-weight: 600; font-size: 14px; padding: 9px 16px; border-radius: 10px; cursor: pointer; border: 1px solid var(--verde); background: var(--verde); color: #fff; }
.btn.claro { background: transparent; color: var(--verde); }
.btn:disabled { opacity: .5; cursor: default; }
.estado { font-size: 13px; color: var(--suave); margin: 8px 0 0; }
.filtro { display: flex; align-items: center; gap: 8px; }
.estado.erro { color: var(--nega); font-weight: 600; }
.sugerido { margin-top: 8px; font-size: 14px; }
.sugerido b { color: var(--edita); }
.final { margin-top: 36px; background: var(--papel); border: 1px solid var(--linha); border-radius: 16px; padding: 18px; }
.final h2 { font-size: 28px; }
.resumo-lista { margin: 8px 0 0; padding-left: 18px; font-size: 14px; }
.aviso { background: var(--papel); border: 1px solid var(--linha); border-radius: 14px; padding: 20px; margin-top: 24px; }
.aviso h2 { margin-bottom: 6px; }
.vazio { color: var(--suave); text-align: center; padding: 30px 0; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="topo">
  <div class="envolve">
    <p class="olho">HoloHacking · HOLOSCAN</p>
    <h1>Revisão das perguntas</h1>
    <p class="sub" id="sub">Carregando…</p>
    <ul class="como" aria-label="Como revisar">
      <li><b>Aprovar</b>: a pergunta fica como está</li>
      <li><b>Negar</b>: tirar a pergunta (diga o porquê, se quiser)</li>
      <li><b>Editar</b>: escreva como a pergunta deveria ficar</li>
    </ul>
  </div>
</header>
<div class="barra" id="barra" hidden>
  <div class="envolve">
    <div class="prog">
      <div class="prog-txt" id="prog-txt" role="status" aria-live="polite"></div>
      <div class="trilho" aria-hidden="true"><i id="prog-barra"></i></div>
    </div>
    <span class="filtro"><label for="filtro" class="prog-txt">Mostrar</label>
    <select id="filtro"><option value="todas">Todas</option><option value="pendentes">Só pendentes</option></select></span>
  </div>
</div>
<main class="envolve" id="conteudo" aria-live="polite"></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<script src="/supabase-client.js"></script>
<script src="/aprovacoes.js"></script>
</body>
</html>
